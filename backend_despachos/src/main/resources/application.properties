spring.application.name=backend-despachos

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/despachos_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8081

# URL interna del microservicio de Ventas. En docker-compose y en Kubernetes
# ambos usan el mismo nombre de servicio "backend-ventas", por lo que esta
# misma config funciona en los dos entornos sin cambios.
ventas.service.url=${VENTAS_SERVICE_URL:http://backend-ventas:8080}

# Actuator: usado por kubectl/HPA y para verificar salud del pod
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
