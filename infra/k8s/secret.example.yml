# PLANTILLA - no contiene credenciales reales.
#
# NO apliques este archivo tal cual ni lo subas a git con una contraseña
# real dentro. Crea el Secret directamente desde la línea de comandos para
# no dejar la contraseña en el historial del repositorio:
#
#   kubectl create secret generic innovatech-secrets \
#     --from-literal=MYSQL_ROOT_PASSWORD='TU_PASSWORD_SEGURA'
#
# Esto es lo que se evalúa en el indicador IE5 (Gestión de Secrets y
# credenciales): la contraseña vive en el clúster, no en el código fuente.
#
# Si igual quieres aplicarlo como YAML (por ejemplo en un pipeline), genera
# el valor en base64 y pégalo en `data`, nunca la contraseña en texto plano:
#
#   echo -n 'TU_PASSWORD_SEGURA' | base64
#
apiVersion: v1
kind: Secret
metadata:
  name: innovatech-secrets
type: Opaque
data:
  MYSQL_ROOT_PASSWORD: <BASE64_DE_TU_PASSWORD_AQUI>
